[project]
name = "agentix"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andreas Werdich", email = "andreas_werdich@hms.harvard.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.6.1",
    "numpy>=2.5.1",
    "openai>=2.46.0",
    "pandas>=3.0.3",
    "pyarrow>=25.0.0",
    "python-dotenv>=1.2.2",
    "tqdm>=4.69.0",
]

[project.scripts]
agentix = "agentix:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

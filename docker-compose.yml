services:
  ollama:
    image: docker.io/ollama/ollama:latest
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_DEBUG=1
    volumes:
      - ollama_data:/root/.ollama   
    ports:
      - '11434:11434'

volumes:
  ollama_data:
    external: false
services:
  ollama:
    image: docker.io/ollama/ollama:latest
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_DEBUG=1
    volumes:
      - ollama_data:/root/.ollama   
    networks:
      ollama_network:
        aliases:
          - ollama
    ports:
      - '11434:11434'

  open-webui:
      image: ghcr.io/open-webui/open-webui:v0.11.1
      restart: unless-stopped
      volumes:
        - open_webui_data:/app/backend/data
      depends_on:
        - ollama
      networks:
        - ollama_network
      ports:
        - '3000:8080'
      environment:
        - 'OLLAMA_BASE_URL=http://ollama:11434'
        - WEBUI_SECRET_KEY=1234
        - WEBUI_AUTH=False
        - ENABLE_DB_MIGRATIONS=True

  app:
    image: agentix:0.0.1
    container_name: agentix
    build: 
      context: .
      network: host
      dockerfile: Dockerfile
    ipc: host
    environment:
      - HOME=/app
      - DATA_DIR=/app/data
      - HF_HOME=/app/data/hf-cache
    env_file:
      - ./.env
    ports:
      - "8888:8888"
    networks:
      - ollama_network
    volumes:
      - .:/app
      - ${DATA_DIR}:/app/data

volumes:
  ollama_data:
    external: false
  open_webui_data:
    external: false
networks:
  ollama_network:
    driver: bridge